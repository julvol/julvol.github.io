<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>discgolfstats</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Installable app (see manifest.webmanifest and sw.js)-->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#50432c" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Disc Golf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Font Awesome icons (free version)-->
    <script
      src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
      crossorigin="anonymous"
    ></script>
    <!-- Google fonts-->
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body id="page-top" class="d-flex flex-column min-vh-100">
    <!-- Navigation-->
    <nav
      class="navbar navbar-expand-lg bg-secondary text-uppercase fixed-top"
      id="mainNav"
    >
      <div class="container">
        <a class="navbar-brand" href="#page-top">Disc Golf - Statistiken</a>
        <button
          class="navbar-toggler text-uppercase font-weight-bold bg-primary text-white rounded"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive"
          aria-controls="navbarResponsive"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          Menu
          <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item mx-0 mx-lg-1">
              <a class="nav-link py-3 px-0 px-lg-3 rounded" href="#partien"
                >Partien</a
              >
            </li>
            <li class="nav-item mx-0 mx-lg-1">
              <a class="nav-link py-3 px-0 px-lg-3 rounded" href="#about"
                >Spieler</a
              >
            </li>
            <li class="nav-item mx-0 mx-lg-1">
              <a class="nav-link py-3 px-0 px-lg-3 rounded" href="#courseList"
                >Parcours</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="content-wrapper d-flex flex-column flex-grow-1">
      <!-- Masthead-->
      <!-- Partien Section-->
      <section
        class="masthead page-section partien"
        id="partien"
        style="background-color: #fde1c7"
      >
        <div class="container" id="partien-container">
          <!-- Partien Section Heading-->
          <h2
            class="page-section-heading text-center text-uppercase text-secondary mb-0"
          >
            Gespielte Partien
          </h2>
          <!-- Icon Divider-->
          <div class="divider-custom">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
          </div>

          <!-- Filter for the matches (see setupMatchFilter in scripts.js) -->
          <div class="d-flex justify-content-center">
            <div style="width: 100%; max-width: 600px">
              <div class="match-filter" id="matchFilterBox">
                <button
                  type="button"
                  class="btn btn-outline-secondary rounded-circle match-filter-toggle"
                  id="matchFilterToggle"
                  aria-label="Partien filtern"
                  aria-expanded="false"
                >
                  <i class="fas fa-magnifying-glass"></i>
                </button>
                <input
                  type="search"
                  id="matchFilter"
                  class="form-control"
                  placeholder="Suche in Partien"
                  autocomplete="off"
                  tabindex="-1"
                />
              </div>
              <div id="matchFilterInfo" class="small text-secondary mt-1"></div>
              <!-- shown when the Google Sheet can't be loaded (see fetchAndRenderData) -->
              <div id="offlineNotice" class="small text-secondary mt-1" hidden></div>
            </div>
          </div>

          <!-- Here come all the match containers! -->
        </div>
      </section>
      <!-- Spieler Section-->
      <section
        class="page-section bg-primary text-white mb-0 flex-grow-1"
        id="about"
      >
        <div class="container">
          <!-- Spieler Section Heading-->
          <h2
            class="page-section-heading text-center text-uppercase text-white"
          >
            Spieler
          </h2>
          <!-- Icon Divider-->
          <div class="divider-custom divider-light">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
          </div>
          <!-- Accordion Buttons -->
          <div class="accordion" id="playersAccordion">
            <!-- Here come all the players! -->
          </div>
        </div>
      </section>
    </div>
    <!-- Parcours Section-->
      <section
        class="page-section"
        id="courseList"
        style="background-color: #fde1c7"
      >
        <div class="container">
          <!-- Spieler Section Heading-->
          <h2
            class="page-section-heading text-center text-uppercase"
          >
            Gespielte Parcours
          </h2>
          <!-- Icon Divider-->
          <div class="divider-custom">
            <div class="divider-custom-line"></div>
            <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
            <div class="divider-custom-line"></div>
          </div>
          <!-- Accordion Buttons -->
          <div class="accordion" id="coursesAccordion">
            <!-- Here come all the courses! -->
          </div>
        </div>
      </section>
    </div>
    <!-- Copyright Section-->
    <div class="copyright py-4 text-center text-white mt-auto">
      <div class="container">
        <small>&copy; 2026 discgolfstats</small>
      </div>
    </div>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
    <!-- * *                               SB Forms JS                               * *-->
    <!-- * * Activate your form at https://startbootstrap.com/solution/contact-forms * *-->
    <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
    <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
    <script>
      const discgolfstatsTable = new StatsTable(
        "14up0_1zaAB4xFlMcZLhKO15Wh7Ay9eNCegthaG4RzVk",
        "Main",
        "Class Data",
        "discgolfstats_stats_table",
      );

      discgolfstatsTable.initialize();

      // makes the site installable and usable offline (see sw.js)
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
  </body>
</html>
